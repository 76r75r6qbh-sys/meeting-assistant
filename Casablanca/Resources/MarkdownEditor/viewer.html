<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="toastui-editor.min.css">
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      --markdown-foreground: #1f2937;
      --markdown-muted: #475569;
      --markdown-link: #2563eb;
      --markdown-code-background: rgba(148, 163, 184, 0.18);
      --markdown-quote-border: rgba(15, 23, 42, 0.16);
      --markdown-table-border: rgba(15, 23, 42, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --markdown-foreground: #e5e7eb;
        --markdown-muted: #cbd5e1;
        --markdown-link: #93c5fd;
        --markdown-code-background: rgba(148, 163, 184, 0.22);
        --markdown-quote-border: rgba(148, 163, 184, 0.32);
        --markdown-table-border: rgba(148, 163, 184, 0.24);
      }
    }

    html, body, #viewer {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }

    body {
      color: var(--markdown-foreground);
      overflow: auto;
    }

    .toastui-editor-contents {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      font-size: 14px;
      line-height: 1.55;
      padding: 0;
      background: transparent;
      color: var(--markdown-foreground);
    }

    .toastui-editor-contents,
    .toastui-editor-contents p,
    .toastui-editor-contents li,
    .toastui-editor-contents h1,
    .toastui-editor-contents h2,
    .toastui-editor-contents h3,
    .toastui-editor-contents h4,
    .toastui-editor-contents h5,
    .toastui-editor-contents h6,
    .toastui-editor-contents strong,
    .toastui-editor-contents em,
    .toastui-editor-contents code,
    .toastui-editor-contents pre,
    .toastui-editor-contents td,
    .toastui-editor-contents th,
    .toastui-editor-contents blockquote {
      color: var(--markdown-foreground);
    }

    .toastui-editor-contents a {
      color: var(--markdown-link);
    }

    .toastui-editor-contents code,
    .toastui-editor-contents pre {
      background: var(--markdown-code-background);
    }

    .toastui-editor-contents blockquote {
      border-left-color: var(--markdown-quote-border);
      color: var(--markdown-muted);
    }

    .toastui-editor-contents table th,
    .toastui-editor-contents table td {
      border-color: var(--markdown-table-border);
    }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <script src="toastui-editor-all.min.js"></script>
  <script src="viewer-bridge.js"></script>
</body>
</html>
